<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menú - IndiceIA</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body { margin: 0; font-family: system-ui; }
  </style>
</head>
<body>
  <div id="root">
    <div class="flex items-center justify-center h-screen bg-gray-100">
      <div class="text-center">
        <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-amber-600 mx-auto"></div>
        <p class="mt-4 text-slate-600">Cargando menú...</p>
      </div>
    </div>
  </div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const C1_Napolitana = () => {
      const [data, setData] = useState(null);
      const [activeTab, setActiveTab] = useState(null);
      const [cart, setCart] = useState([]);
      const [showCart, setShowCart] = useState(false);
      const [toast, setToast] = useState(null);
      const [cartBounce, setCartBounce] = useState(false);

      // Recibir datos vía postMessage
      useEffect(() => {
        const handler = (event) => {
          if (event.data && event.data.bloque_B_contexto_comercial) {
            setData(event.data.bloque_B_contexto_comercial);
          }
        };
        window.addEventListener('message', handler);
        // Avisar que estamos listos
        window.parent.postMessage({ type: 'TEMPLATE_READY' }, '*');
        return () => window.removeEventListener('message', handler);
      }, []);

      if (!data) return null;

      const { identity = {}, contacto = {}, catalogo = {} } = data;
      const nombreComercio = identity.nombre_comercio || 'Comercio';
      const whatsappNumber = contacto.whatsapp_number || '';
      const categorias = catalogo.categorias || [];
      const items = catalogo.items || [];

      useEffect(() => {
        if (categorias.length > 0 && !activeTab) {
          setActiveTab(categorias[0]);
        }
      }, [categorias]);

      const addToCart = (item, size = null) => {
        const precio = size 
          ? (size === 'mediana' ? item.precio_mediana : item.precio_grande) 
          : item.precio || 0;
        
        const newItem = {
          ...item,
          size,
          precio,
          cartId: Date.now() + Math.random()
        };
        
        setCart([...cart, newItem]);
        
        const sizeText = size ? ` (${size.charAt(0).toUpperCase() + size.slice(1)})` : '';
        setToast(`✓ ${item.nombre}${sizeText} agregado`);
        setTimeout(() => setToast(null), 2000);
        
        setCartBounce(true);
        setTimeout(() => setCartBounce(false), 500);
      };

      const removeFromCart = (cartId) => {
        setCart(cart.filter(i => i.cartId !== cartId));
      };

      const getTotal = () => cart.reduce((sum, i) => sum + i.precio, 0);

      const generateWhatsAppMessage = () => {
        let mensaje = `Hola! Vengo de INDICEIA\n\nMI PEDIDO:\n\n`;
        cart.forEach(item => {
          const sizeText = item.size ? ` (${item.size.charAt(0).toUpperCase() + item.size.slice(1)})` : '';
          mensaje += `• ${item.nombre}${sizeText} [${item.id}] - $${item.precio.toLocaleString()}\n`;
        });
        mensaje += `\nTOTAL: $${getTotal().toLocaleString()}\n\nEspero tu confirmación!`;
        return `https://wa.me/${whatsappNumber}?text=${encodeURIComponent(mensaje)}`;
      };

      const totalItems = cart.length;
      const itemsActivos = items.filter(item => item.categoria === activeTab);

      return (
        <div className="min-h-screen bg-gradient-to-br from-slate-50 via-gray-50 to-slate-100">
          {/* Toast */}
          {toast && (
            <div className="fixed top-24 left-1/2 -translate-x-1/2 bg-slate-700 text-white px-3 py-2 rounded-lg shadow-xl z-50 text-xs font-semibold">
              {toast}
            </div>
          )}
          
          {/* Header */}
          <div className="sticky top-0 z-40 bg-slate-800 text-white shadow-lg">
            <div className="px-3 py-1.5 flex justify-between items-center">
              <h1 className="text-sm font-bold">{nombreComercio}</h1>
              <button 
                onClick={() => setShowCart(true)}
                className={`relative bg-amber-600 px-3 py-1 rounded-full text-xs font-bold flex items-center gap-1 transition-transform ${cartBounce ? 'scale-125' : ''}`}
              >
                <lucide-react.ShoppingCart size={14} />
                <span>{totalItems}</span>
              </button>
            </div>
            <div className="flex overflow-x-auto bg-slate-700">
              {categorias.map(cat => (
                <button
                  key={cat}
                  onClick={() => setActiveTab(cat)}
                  className={`px-3 py-2 text-xs font-semibold whitespace-nowrap transition-all ${
                    activeTab === cat ? 'bg-white text-slate-800' : 'text-white hover:bg-slate-600'
                  }`}
                >
                  {cat}
                </button>
              ))}
            </div>
          </div>

          {/* Grid */}
          <div className="p-2 pb-32">
            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-2 max-w-7xl mx-auto">
              {itemsActivos.map(item => (
                <div key={item.id} className="bg-white rounded-xl shadow-lg overflow-hidden">
                  <div className="relative h-40 bg-gray-200">
                    <img 
                      src={item.image_url || 'https://via.placeholder.com/800x600?text=Sin+Imagen'}
                      alt={item.nombre}
                      className="w-full h-full object-cover"
                    />
                    <div className="absolute top-2 right-2 bg-slate-800 text-white px-2 py-0.5 rounded-full text-xs">
                      {item.id}
                    </div>
                  </div>
                  <div className="p-2">
                    <h3 className="font-bold text-sm mb-2">{item.nombre}</h3>
                    {item.precio_mediana && item.precio_grande ? (
                      <>
                        <div className="flex justify-between items-center bg-amber-50 p-2 rounded-lg mb-1">
                          <span className="text-xs">Mediana</span>
                          <div className="flex items-center gap-2">
                            <span className="font-bold text-sm text-amber-600">${item.precio_mediana.toLocaleString()}</span>
                            <button onClick={() => addToCart(item, 'mediana')} className="bg-amber-600 text-white p-1.5 rounded">
                              <lucide-react.Plus size={16} />
                            </button>
                          </div>
                        </div>
                        <div className="flex justify-between items-center bg-amber-50 p-2 rounded-lg">
                          <span className="text-xs">Grande</span>
                          <div className="flex items-center gap-2">
                            <span className="font-bold text-sm text-amber-600">${item.precio_grande.toLocaleString()}</span>
                            <button onClick={() => addToCart(item, 'grande')} className="bg-amber-600 text-white p-1.5 rounded">
                              <lucide-react.Plus size={16} />
                            </button>
                          </div>
                        </div>
                      </>
                    ) : (
                      <div className="flex justify-between items-center bg-amber-50 p-2 rounded-lg">
                        <span className="font-bold text-sm text-amber-600">${(item.precio || 0).toLocaleString()}</span>
                        <button onClick={() => addToCart(item)} className="bg-amber-600 text-white px-3 py-1.5 rounded text-xs font-bold flex items-center gap-1">
                          <lucide-react.Plus size={14} />
                          Agregar
                        </button>
                      </div>
                    )}
                  </div>
                </div>
              ))}
            </div>
          </div>

          {/* Carrito modal (mismo código que tenías, lo mantengo) */}
          {/* ... (pongo el carrito completo igual que en tu component.jsx) ... */}

        </div>
      );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<C1_Napolitana />);
  </script>
  <script>
    lucide.createIcons();
  </script>
</body>
</html>
