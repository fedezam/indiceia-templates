<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #f1f5f9; font-family: sans-serif; padding-bottom: 80px; }

    #toast {
      position: fixed;
      top: 90px;
      left: 50%;
      transform: translateX(-50%) translateY(-60px);
      background: #1e293b;
      color: white;
      padding: 8px 16px;
      border-radius: 6px;
      font-size: .75rem;
      font-weight: 600;
      z-index: 9999;
      opacity: 0;
      transition: opacity .25s, transform .25s cubic-bezier(.34,1.56,.64,1);
      pointer-events: none;
      white-space: nowrap;
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    .header-wrap {
      position: sticky;
      top: 0;
      z-index: 100;
      background: #1e293b;
      color: white;
    }
    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 12px;
    }
    .header-top h1 { font-size: .9rem; font-weight: 700; }

    .cart-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      background: #d97706;
      border: none;
      color: white;
      padding: 5px 12px;
      border-radius: 999px;
      font-size: .8rem;
      font-weight: 700;
      cursor: pointer;
      transition: background .15s, transform .1s;
    }
    .cart-btn:hover { background: #b45309; }
    .cart-btn:active { transform: scale(.95); }
    #cartCount {
      background: white;
      color: #d97706;
      border-radius: 999px;
      padding: 1px 7px;
      font-size: .75rem;
      font-weight: 800;
    }
    #cartCount.bump { animation: cartShake .4s ease; }
    @keyframes cartShake {
      0%   { transform: scale(1); }
      20%  { transform: scale(1.5) rotate(-8deg); }
      40%  { transform: scale(1.5) rotate(8deg); }
      60%  { transform: scale(1.3) rotate(-5deg); }
      80%  { transform: scale(1.2) rotate(3deg); }
      100% { transform: scale(1) rotate(0); }
    }
    .cart-btn.shake { animation: btnPulse .4s ease; }
    @keyframes btnPulse {
      0%   { transform: scale(1); }
      30%  { transform: scale(1.15); }
      60%  { transform: scale(.95); }
      100% { transform: scale(1); }
    }

    .tabs {
      display: flex;
      overflow-x: auto;
      background: #334155;
      scrollbar-width: none;
    }
    .tabs::-webkit-scrollbar { display: none; }
    .tab {
      padding: 8px 14px;
      font-size: .75rem;
      font-weight: 700;
      color: #94a3b8;
      border: none;
      background: none;
      cursor: pointer;
      white-space: nowrap;
      transition: color .15s, background .15s;
    }
    .tab.active { background: white; color: #1e293b; }

    .grid {
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .card {
      background: white;
      border-radius: 8px;
      box-shadow: 0 1px 3px rgba(0,0,0,.1);
      overflow: hidden;
      animation: fadeUp .25s ease both;
      transition: box-shadow .2s;
    }
    .card:hover { box-shadow: 0 4px 12px rgba(0,0,0,.12); }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .card img { width: 100%; height: 160px; object-fit: cover; display: block; }
    .card-body { padding: 8px 10px 10px; }
    .card-body h3 { font-size: .9rem; font-weight: 700; margin-bottom: 4px; }
    .card-body p  { font-size: .8rem; color: #64748b; margin-bottom: 8px; }
    .card-footer-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .price { font-weight: 700; color: #d97706; font-size: .95rem; }

    .variants { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
    .variant-btn {
      padding: 3px 10px;
      border-radius: 5px;
      border: 1px solid #cbd5e1;
      font-size: .75rem;
      cursor: pointer;
      background: white;
      transition: background .15s, color .15s, border-color .15s;
    }
    .variant-btn.active { background: #d97706; color: white; border-color: #d97706; }

    .add-btn {
      background: #d97706;
      color: white;
      border: none;
      width: 30px; height: 30px;
      border-radius: 6px;
      font-size: 1.2rem;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background .15s, transform .1s;
    }
    .add-btn:hover { background: #b45309; }
    .add-btn:active { transform: scale(.88); }

    #cartOverlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.5);
      z-index: 200;
    }
    #cartOverlay.open { display: block; }
    #cartPanel {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      background: white;
      border-radius: 16px 16px 0 0;
      padding: 16px;
      max-height: 80vh;
      overflow-y: auto;
      animation: slideUp .25s ease;
    }
    @keyframes slideUp {
      from { transform: translateY(30px); opacity: 0; }
      to   { transform: translateY(0);    opacity: 1; }
    }
    #cartPanel h2 { font-size: 1rem; font-weight: 700; margin-bottom: 12px; }
    .cart-row {
      display: flex;
      justify-content: space-between;
      font-size: .85rem;
      padding: 6px 0;
      border-bottom: 1px solid #f1f5f9;
    }
    .cart-row span:last-child { font-weight: 600; color: #d97706; }
    .cart-total-row {
      display: flex;
      justify-content: space-between;
      font-weight: 700;
      font-size: 1rem;
      margin-top: 12px;
      padding-top: 8px;
      border-top: 2px solid #e2e8f0;
    }
    .wa-btn {
      display: block;
      margin-top: 14px;
      background: #16a34a;
      color: white;
      text-align: center;
      padding: 12px;
      border-radius: 8px;
      font-weight: 700;
      font-size: .9rem;
      text-decoration: none;
    }
    .cart-empty { text-align: center; color: #94a3b8; font-size: .85rem; padding: 20px 0; }
    .section { display: none; }
    .section.active { display: block; }
  </style>
</head>

"pBoU1YJasc4aJbvXb497","nombre":"Pizza Ananá","precio_final":5500,"codigo":"1017","descripcion":"Pizza Ananá tamaño grande","imagen":"https://picsum.photos/seed/Ananágrande/400/300"},{"id":"t0EHNPRFkHlh51K9VxoW","nombre":"Pizza Napolitana","precio_final":3500,"codigo":"1002","descripcion":"Pizza Napolitana tamaño chica","imagen":"https://picsum.photos/seed/Napolitanachica/400/300"},{"id":"tZXuBLrSfDLXx3lpKTa8","nombre":"Cerveza Negra","precio_final":1200,"codigo":"1037","descripcion":"Bebida Cerveza Negra","imagen":"https://picsum.photos/seed/bebidaCerveza_Negra/400/300"},{"id":"u6YkSobhPASOlT2sUqVv","nombre":"Pizza Fugazzeta","precio_final":5500,"codigo":"1005","descripcion":"Pizza Fugazzeta tamaño grande","imagen":"https://picsum.photos/seed/Fugazzetagrande/400/300"},{"id":"w1PSnc5Ua5fEpfpbRfpA","nombre":"Empanada Pollo","precio_final":800,"codigo":"1021","descripcion":"Empanada de Pollo","imagen":"https://picsum.photos/seed/empanadaPollo/400/300"},{"id":"xtmB8bh8kPgmwuDNwjIL","nombre":"Pizza Rúcula y Crudo","precio_final":5500,"codigo":"1013","descripcion":"Pizza Rúcula y Crudo tamaño grande","imagen":"https://picsum.photos/seed/Rúcula_y_Crudogrande/400/300"}];

const cart = {};
const selectedVariants = {};
const categories = [...new Set(GOODS.map(g => g.categoria || 'General'))];

const tabsEl     = document.getElementById('tabs');
const sectionsEl = document.getElementById('sections');

categories.forEach((cat, i) => {
  const tab = document.createElement('button');
  tab.className = 'tab' + (i === 0 ? ' active' : '');
  tab.textContent = cat;
  tab.onclick = () => switchTab(cat);
  tabsEl.appendChild(tab);

  const section = document.createElement('div');
  section.className = 'section' + (i === 0 ? ' active' : '');
  section.id = 'cat_' + i;

  const grid = document.createElement('div');
  grid.className = 'grid';
  GOODS.filter(g => (g.categoria || 'General') === cat).forEach(item => {
    grid.appendChild(buildCard(item));
  });

  section.appendChild(grid);
  sectionsEl.appendChild(section);
});

function buildCard(item) {
  const card = document.createElement('div');
  card.className = 'card';

  if (item.imagen) {
    const img = document.createElement('img');
    img.src = item.imagen; img.alt = item.nombre;
    card.appendChild(img);
  }

  const body = document.createElement('div');
  body.className = 'card-body';

  const h3 = document.createElement('h3');
  h3.textContent = item.nombre;
  body.appendChild(h3);

  if (item.descripcion) {
    const p = document.createElement('p');
    p.textContent = item.descripcion;
    body.appendChild(p);
  }

  if (item.variantes?.length) {
    selectedVariants[item.id] = item.variantes[0];
    const varDiv = document.createElement('div');
    varDiv.className = 'variants';
    item.variantes.forEach(v => {
      const btn = document.createElement('button');
      btn.className = 'variant-btn' + (v.id === item.variantes[0].id ? ' active' : '');
      btn.textContent = v.label;
      btn.id = 'vbtn_' + item.id + '_' + v.id;
      btn.onclick = () => {
        selectedVariants[item.id] = v;
        item.variantes.forEach(vv => {
          document.getElementById('vbtn_' + item.id + '_' + vv.id).className =
            'variant-btn' + (vv.id === v.id ? ' active' : '');
        });
        document.getElementById('price_' + item.id).textContent =
          '$' + v.precio.toLocaleString('es-AR');
      };
      varDiv.appendChild(btn);
    });
    body.appendChild(varDiv);
  }

  const footer = document.createElement('div');
  footer.className = 'card-footer-row';

  const priceEl = document.createElement('span');
  priceEl.className = 'price';
  priceEl.id = 'price_' + item.id;
  priceEl.textContent = '$' + (item.variantes?.[0]?.precio ?? item.precio_final).toLocaleString('es-AR');

  const addBtn = document.createElement('button');
  addBtn.className = 'add-btn';
  addBtn.textContent = '+';
  addBtn.onclick = () => {
    addToCart(item);
    addBtn.style.animation = 'none';
    void addBtn.offsetWidth;
    addBtn.style.animation = '';
    showToast('✓ ' + item.nombre + ' agregado');
  };

  footer.appendChild(priceEl);
  footer.appendChild(addBtn);
  body.appendChild(footer);
  card.appendChild(body);
  return card;
}

function switchTab(cat) {
  categories.forEach((c, i) => {
    document.getElementById('cat_' + i).className =
      'section' + (c === cat ? ' active' : '');
  });
  document.querySelectorAll('.tab').forEach((t, i) => {
    t.className = 'tab' + (categories[i] === cat ? ' active' : '');
  });
}

function addToCart(item) {
  const variant = selectedVariants[item.id] || null;
  const key     = item.id + '_' + (variant?.id || 'base');
  const price   = variant ? variant.precio : item.precio_final;
  const label   = variant ? item.nombre + ' (' + variant.label + ')' : item.nombre;
  if (cart[key]) { cart[key].qty++; }
  else { cart[key] = { key, label, precio: price, qty: 1 }; }
  updateCartCount();
}

function updateCartCount() {
  const items = Object.values(cart);
  const count = items.reduce((a, i) => a + i.qty, 0);
  const badge = document.getElementById('cartCount');
  const btn   = document.querySelector('.cart-btn');
  badge.textContent = count;
  badge.classList.remove('bump'); btn.classList.remove('shake');
  void badge.offsetWidth;
  badge.classList.add('bump'); btn.classList.add('shake');
  setTimeout(() => { badge.classList.remove('bump'); btn.classList.remove('shake'); }, 450);
}

function openCart() {
  const items = Object.values(cart);
  const total = items.reduce((a, i) => a + i.precio * i.qty, 0);
  const cartItemsEl = document.getElementById('cartItems');
  cartItemsEl.innerHTML = '';
  if (!items.length) {
    cartItemsEl.innerHTML = '<p class="cart-empty">No hay ítems aún.</p>';
  } else {
    items.forEach(i => {
      const row = document.createElement('div');
      row.className = 'cart-row';
      row.innerHTML = '<span>' + i.label + (i.qty > 1 ? ' x' + i.qty : '') + '</span><span>$' + (i.precio * i.qty).toLocaleString('es-AR') + '</span>';
      cartItemsEl.appendChild(row);
    });
  }
  document.getElementById('cartTotal').textContent = '$' + total.toLocaleString('es-AR');
  const msg = 'Hola! Mi pedido:\n\n' +
    items.map(i => '• ' + i.label + ' x' + i.qty + ' - $' + (i.precio * i.qty).toLocaleString('es-AR')).join('\n') +
    '\n\nTOTAL: $' + total.toLocaleString('es-AR');
  document.getElementById('waLink').href = 'https://wa.me/' + WHATSAPP + '?text=' + encodeURIComponent(msg);
  document.getElementById('cartOverlay').className = 'open';
  document.getElementById('cartOverlay').style.display = 'block';
}

function handleOverlayClick(e) {
  if (e.target === document.getElementById('cartOverlay')) closeCart();
}

function closeCart() {
  const overlay = document.getElementById('cartOverlay');
  overlay.style.display = 'none';
  overlay.className = '';
}

let toastTimer;
function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove('show'), 1800);
}
</script>
