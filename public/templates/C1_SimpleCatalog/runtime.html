<!DOCTYPE html>
<html lang="es">
<head>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>C1_SimpleCatalog – Runtime</title>

  <!-- React PROD -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <!-- Babel runtime -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Icons -->
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

</head>

<body class="bg-amber-50">

  <div id="root"></div>

  <!-- Loader cognitivo -->
  <script type="text/babel">

    let currentData = null
    let rendered = false

    const renderIfReady = () => {

      if (rendered) return

      if (!window.C1_SimpleCatalog) return
      if (!currentData) return

      rendered = true

      const root = ReactDOM.createRoot(
        document.getElementById("root")
      )

      root.render(
        <window.C1_SimpleCatalog
          entityData={currentData}
        />
      )
    }

    window.addEventListener("message",(event)=>{

      if (!event.data) return
      if (typeof event.data !== "object") return

      currentData = event.data

      renderIfReady()

    })

    // fallback por si el componente carga primero
    window.addEventListener("load",renderIfReady)

  </script>


  <!-- COMPONENTE -->
  <script
    type="text/babel"
    src="./previews/component.preview.jsx">
  </script>

</body>
</html>
