<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Preview: C1_SimpleCatalog</title>

  <!-- React DEV (mejores errores en preview) -->
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

  <!-- Babel standalone -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Lucide UMD -->
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>

  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body { margin: 0; background: #f1f5f9; }
    #root { min-height: 100vh; }
  </style>
</head>
<body>
  <div id="root">
    <p style="padding:16px;font-family:sans-serif;">
      Cargando preview del template...
    </p>
  </div>

  <!-- Fake data + render -->
  <script type="text/babel">
    const fakeBloqueB = {
      identity: {
        nombre_comercio: "Pizzería Napolitana"
      },
      contacto: {
        whatsapp_number: "5493412295316"
      },
      catalogo: {
        categorias: ["Pizzas", "Empanadas", "Bebidas", "Postres"],
        items: [
          { id: "1", nombre: "Pizza Margherita", precio_final: 8500, imagen: "https://images.unsplash.com/photo-1574071318508-1cdbab80fff6?w=800&q=80", categoria: "Pizzas" },
          { id: "2", nombre: "Pizza Napolitana", precio_final: 9500, imagen: "https://images.unsplash.com/photo-1513104890138-7c749659a591?w=800&q=80", categoria: "Pizzas" },
          { id: "3", nombre: "Empanadas Carne (12u)", precio_final: 12000, imagen: "https://images.unsplash.com/photo-1626645738306-2427b3d2c6ec?w=800&q=80", categoria: "Empanadas" },
          { id: "4", nombre: "Coca Cola 1.5L", precio_final: 2500, imagen: "https://images.unsplash.com/photo-1622485761324-8248b6c96595?w=800&q=80", categoria: "Bebidas" }
        ]
      }
    };

    const tryRender = () => {
      if (window.C1_SimpleCatalog) {
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(
          <window.C1_SimpleCatalog
            entityData={{ bloque_B_contexto_comercial: fakeBloqueB }}
          />
        );
      } else {
        setTimeout(tryRender, 50);
      }
    };

    tryRender();
  </script>

  <!-- COMPONENTE PREVIEW -->
  <script type="text/babel" src="./component.preview.jsx"></script>
</body>
</html>
