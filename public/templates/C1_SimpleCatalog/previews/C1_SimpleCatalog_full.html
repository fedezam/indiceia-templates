<body>

          {
            id: "principal",

    const render = () => {
      if (window.C1_SimpleCatalog) {
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<window.C1_SimpleCatalog entityData={{ bloque_B_contexto_comercial: fakeBloqueB }} />);
      } else {
        setTimeout(render, 100);
      }
    };
    render();

  <script type="text/babel" src="../component.jsx"></script>
