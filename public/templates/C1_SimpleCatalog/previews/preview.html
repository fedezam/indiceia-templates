<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>La Brasserie — Preview</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --gold: #D4AF37;
  --gold-light: #F0CC5A;
  --dark: #111111;
  --dark2: #1A1A1A;
  --dark3: #242424;
  --card-bg: #1E1E1E;
  --text: #F5F5F5;
  --text-muted: #999;
  --accent: #E85D26;
  --radius: 16px;
  --header-h: 148px;
  --font-display: 'Playfair Display', serif;
  --font-body: 'DM Sans', sans-serif;
}
html { scroll-behavior: smooth; }
body { background: var(--dark); color: var(--text); font-family: var(--font-body); min-height: 100vh; overflow-x: hidden; }

#site-header { position: fixed; top: 0; left: 0; right: 0; z-index: 100; background: var(--dark2); border-bottom: 1px solid rgba(212,175,55,0.15); box-shadow: 0 4px 32px rgba(0,0,0,0.5); }
.header-bg { position: absolute; inset: 0; background: linear-gradient(135deg, rgba(212,175,55,0.05) 0%, transparent 60%); pointer-events: none; }
.header-content { padding: 14px 16px 10px; position: relative; }
.header-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.logo-area { display: flex; align-items: center; gap: 10px; }
.logo-icon { font-size: 24px; filter: drop-shadow(0 0 8px rgba(212,175,55,0.5)); }
.shop-name { font-family: var(--font-display); font-size: 22px; font-weight: 900; letter-spacing: 0.01em; background: linear-gradient(135deg, var(--gold-light), var(--gold)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; line-height: 1.1; }
.cart-btn { position: relative; background: rgba(212,175,55,0.1); border: 1.5px solid rgba(212,175,55,0.3); border-radius: 50px; padding: 8px 16px 8px 12px; cursor: pointer; display: flex; align-items: center; gap: 6px; transition: all 0.2s; font-size: 20px; }
.cart-btn:active { transform: scale(0.95); }
.cart-badge { background: var(--accent); color: white; font-family: var(--font-body); font-size: 12px; font-weight: 700; width: 20px; height: 20px; border-radius: 50%; display: flex; align-items: center; justify-content: center; transition: transform 0.2s; }
.cart-badge.bump { transform: scale(1.4); }
.header-search { position: relative; }
.header-search input { width: 100%; background: rgba(255,255,255,0.07); border: 1.5px solid rgba(255,255,255,0.1); border-radius: 50px; padding: 9px 40px 9px 16px; color: var(--text); font-family: var(--font-body); font-size: 14px; outline: none; transition: border-color 0.2s; }
.header-search input:focus { border-color: rgba(212,175,55,0.5); }
.header-search input::placeholder { color: var(--text-muted); }
.search-icon { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); font-size: 16px; pointer-events: none; }
.category-nav { overflow: hidden; border-top: 1px solid rgba(255,255,255,0.05); }
.category-tabs { display: flex; gap: 4px; padding: 10px 12px 10px; overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
.category-tabs::-webkit-scrollbar { display: none; }
.cat-tab { flex-shrink: 0; background: rgba(255,255,255,0.05); border: 1.5px solid transparent; border-radius: 50px; padding: 6px 16px; font-family: var(--font-body); font-size: 13px; font-weight: 500; color: var(--text-muted); cursor: pointer; transition: all 0.2s; white-space: nowrap; }
.cat-tab:hover { color: var(--text); border-color: rgba(212,175,55,0.2); }
.cat-tab.active { background: rgba(212,175,55,0.15); border-color: var(--gold); color: var(--gold-light); }

#main-content { padding: 12px 12px 100px; margin-top: var(--header-h); }
.products-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; animation: fadeIn 0.4s ease; }
@media (min-width: 520px) { .products-grid { grid-template-columns: repeat(3, 1fr); } }
@media (min-width: 768px) { .products-grid { grid-template-columns: repeat(4, 1fr); gap: 16px; } #main-content { padding: 20px 24px 120px; } }
.category-section-title { grid-column: 1 / -1; font-family: var(--font-display); font-size: 20px; color: var(--gold); padding: 8px 0 4px; border-bottom: 1px solid rgba(212,175,55,0.2); margin-top: 4px; }
.product-card { background: var(--card-bg); border-radius: var(--radius); overflow: hidden; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; border: 1px solid rgba(255,255,255,0.06); animation: fadeUp 0.4s ease both; display: flex; flex-direction: column; }
.product-card:hover { transform: translateY(-3px); box-shadow: 0 8px 32px rgba(0,0,0,0.4); border-color: rgba(212,175,55,0.2); }
.product-card:active { transform: scale(0.97); }
.card-img-wrap { width: 100%; aspect-ratio: 4/3; overflow: hidden; background: var(--dark3); position: relative; }
.card-img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.4s; }
.product-card:hover .card-img { transform: scale(1.06); }
.card-no-img { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; font-size: 40px; background: linear-gradient(135deg, var(--dark3), #2a2a2a); }
.card-body { padding: 10px 10px 8px; flex: 1; display: flex; flex-direction: column; gap: 4px; }
.card-cat { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: var(--gold); opacity: 0.8; }
.card-name { font-family: var(--font-display); font-size: 14px; font-weight: 700; line-height: 1.25; color: var(--text); flex: 1; }
.card-desc { font-size: 11px; color: var(--text-muted); line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.card-footer { display: flex; align-items: center; justify-content: space-between; margin-top: 8px; }
.card-price { font-size: 15px; font-weight: 700; color: var(--gold-light); }
.card-add-btn { background: var(--gold); border: none; border-radius: 50px; width: 28px; height: 28px; font-size: 18px; font-weight: 700; color: var(--dark); cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.15s; flex-shrink: 0; }
.card-add-btn:active { transform: scale(0.9); }
.empty-state { text-align: center; padding: 60px 20px; color: var(--text-muted); }
.empty-icon { font-size: 48px; margin-bottom: 12px; }
.hidden { display: none !important; }

.cart-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 200; opacity: 0; pointer-events: none; transition: opacity 0.3s; backdrop-filter: blur(4px); }
.cart-overlay.open { opacity: 1; pointer-events: all; }
.cart-sheet { position: fixed; bottom: 0; left: 0; right: 0; z-index: 201; background: var(--dark2); border-radius: 24px 24px 0 0; border-top: 1px solid rgba(212,175,55,0.2); transform: translateY(100%); transition: transform 0.35s cubic-bezier(0.32, 0.72, 0, 1); max-height: 85vh; display: flex; flex-direction: column; }
.cart-sheet.open { transform: translateY(0); }
.cart-handle { width: 40px; height: 4px; background: rgba(255,255,255,0.15); border-radius: 2px; margin: 12px auto 0; flex-shrink: 0; }
.cart-header { display: flex; align-items: center; justify-content: space-between; padding: 14px 20px 10px; flex-shrink: 0; border-bottom: 1px solid rgba(255,255,255,0.07); }
.cart-title { font-family: var(--font-display); font-size: 20px; font-weight: 700; color: var(--gold-light); }
.cart-close { background: rgba(255,255,255,0.08); border: none; border-radius: 50%; width: 30px; height: 30px; font-size: 14px; color: var(--text-muted); cursor: pointer; display: flex; align-items: center; justify-content: center; }
.cart-items { flex: 1; overflow-y: auto; padding: 12px 16px; }
.cart-empty-msg { text-align: center; padding: 32px 0; color: var(--text-muted); font-size: 14px; }
.cart-item { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.05); animation: fadeUp 0.2s ease; }
.cart-item-info { flex: 1; min-width: 0; }
.cart-item-name { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cart-item-variant { font-size: 12px; color: var(--text-muted); }
.cart-item-price { font-size: 14px; font-weight: 700; color: var(--gold-light); }
.cart-item-qty { display: flex; align-items: center; gap: 8px; }
.qty-sm { background: transparent; border: 1.5px solid rgba(255,255,255,0.15); border-radius: 50%; width: 26px; height: 26px; font-size: 16px; color: var(--text); cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.15s; }
.qty-sm-num { font-size: 14px; font-weight: 600; min-width: 18px; text-align: center; }
.cart-footer { flex-shrink: 0; padding: 12px 16px 20px; border-top: 1px solid rgba(255,255,255,0.07); }
.cart-total-row { display: flex; justify-content: space-between; align-items: center; font-size: 15px; font-weight: 500; margin-bottom: 12px; color: var(--text-muted); }
.cart-total { font-size: 22px; font-weight: 700; color: var(--text); }
.checkout-btn { width: 100%; background: #25D366; border: none; border-radius: 50px; padding: 15px 24px; font-family: var(--font-body); font-size: 16px; font-weight: 700; color: white; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; transition: all 0.2s; box-shadow: 0 4px 20px rgba(37,211,102,0.3); }

.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.75); z-index: 300; opacity: 0; pointer-events: none; transition: opacity 0.25s; backdrop-filter: blur(6px); }
.modal-overlay.open { opacity: 1; pointer-events: all; }
.product-modal { position: fixed; bottom: 0; left: 0; right: 0; z-index: 301; background: var(--dark2); border-radius: 24px 24px 0 0; max-height: 92vh; overflow-y: auto; transform: translateY(100%); transition: transform 0.35s cubic-bezier(0.32, 0.72, 0, 1); padding-bottom: 20px; }
.product-modal.open { transform: translateY(0); }
.modal-close { position: absolute; top: 14px; right: 14px; z-index: 1; background: rgba(0,0,0,0.5); border: none; border-radius: 50%; width: 32px; height: 32px; font-size: 14px; color: white; cursor: pointer; display: flex; align-items: center; justify-content: center; }
.modal-img-wrap { width: 100%; aspect-ratio: 16/9; overflow: hidden; background: var(--dark3); }
.modal-img-wrap img { width: 100%; height: 100%; object-fit: cover; }
.modal-no-img { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; font-size: 64px; background: linear-gradient(135deg, var(--dark3), #2a2020); }
.modal-body { padding: 20px 20px 24px; }
.modal-cat { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: var(--gold); margin-bottom: 6px; }
.modal-name { font-family: var(--font-display); font-size: 26px; font-weight: 900; line-height: 1.15; margin-bottom: 10px; }
.modal-desc { font-size: 14px; color: var(--text-muted); line-height: 1.6; margin-bottom: 16px; }
.modal-variants { margin-bottom: 16px; }
.variants-label { font-size: 12px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 8px; }
.variants-row { display: flex; gap: 8px; flex-wrap: wrap; }
.variant-btn { background: rgba(255,255,255,0.06); border: 1.5px solid rgba(255,255,255,0.12); border-radius: 50px; padding: 7px 16px; font-family: var(--font-body); font-size: 13px; font-weight: 500; color: var(--text-muted); cursor: pointer; transition: all 0.15s; }
.variant-btn.selected { background: rgba(212,175,55,0.15); border-color: var(--gold); color: var(--gold-light); }
.modal-price-row { margin-bottom: 16px; }
.modal-price { font-family: var(--font-display); font-size: 28px; font-weight: 700; color: var(--gold-light); }
.modal-qty-row { display: flex; align-items: center; gap: 16px; margin-bottom: 20px; justify-content: center; }
.qty-btn { background: rgba(255,255,255,0.08); border: 1.5px solid rgba(255,255,255,0.12); border-radius: 50%; width: 40px; height: 40px; font-size: 22px; color: var(--text); cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.15s; }
.qty-display { font-family: var(--font-display); font-size: 26px; font-weight: 700; min-width: 36px; text-align: center; }
.modal-add-btn { width: 100%; background: var(--gold); border: none; border-radius: 50px; padding: 16px; font-family: var(--font-body); font-size: 16px; font-weight: 700; color: var(--dark); cursor: pointer; transition: all 0.2s; box-shadow: 0 4px 20px rgba(212,175,55,0.3); }

@keyframes fadeUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.product-card:nth-child(1) { animation-delay: 0.03s; } .product-card:nth-child(2) { animation-delay: 0.06s; } .product-card:nth-child(3) { animation-delay: 0.09s; } .product-card:nth-child(4) { animation-delay: 0.12s; } .product-card:nth-child(5) { animation-delay: 0.15s; } .product-card:nth-child(6) { animation-delay: 0.18s; } .product-card:nth-child(7) { animation-delay: 0.21s; } .product-card:nth-child(8) { animation-delay: 0.24s; }
  </style>
</head>
<body>

  <header id="site-header">
    <div class="header-bg"></div>
    <div class="header-content">
      <div class="header-top">
        <div class="logo-area">
          <div class="logo-icon">🍽️</div>
          <h1 class="shop-name" id="shop-name-display">La Brasserie</h1>
        </div>
        <button class="cart-btn" onclick="toggleCart()">
          <span>🛒</span>
          <span class="cart-badge" id="cart-count">0</span>
        </button>
      </div>
      <div class="header-search">
        <input type="text" id="search-input" placeholder="Buscar en el menú..." oninput="filterProducts()"/>
        <span class="search-icon">🔍</span>
      </div>
    </div>
    <nav class="category-nav">
      <div class="category-tabs" id="category-tabs"></div>
    </nav>
  </header>

  <main id="main-content">
    <div id="empty-state" class="empty-state hidden">
      <div class="empty-icon">🍴</div>
      <p>No encontramos platos con esa búsqueda</p>
    </div>
    <div class="products-grid" id="products-grid"></div>
  </main>

  <div class="cart-overlay" id="cart-overlay" onclick="closeCart()"></div>
  <div class="cart-sheet" id="cart-sheet">
    <div class="cart-handle"></div>
    <div class="cart-header">
      <h2 class="cart-title">Tu pedido</h2>
      <button class="cart-close" onclick="closeCart()">✕</button>
    </div>
    <div class="cart-items" id="cart-items"></div>
    <div class="cart-footer" id="cart-footer" style="display:none">
      <div class="cart-total-row">
        <span>Total</span>
        <span class="cart-total" id="cart-total">$0</span>
      </div>
      <button class="checkout-btn" onclick="checkoutWhatsApp()">
        <span>Pedir por WhatsApp</span>
        <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"/><path d="M12 0C5.373 0 0 5.373 0 12c0 2.104.546 4.08 1.5 5.798L0 24l6.357-1.645A11.944 11.944 0 0012 24c6.627 0 12-5.373 12-12S18.627 0 12 0zm0 22c-1.85 0-3.586-.476-5.1-1.31l-.366-.214-3.775.977.998-3.68-.24-.378A9.945 9.945 0 012 12C2 6.477 6.477 2 12 2s10 4.477 10 10-4.477 10-10 10z"/></svg>
      </button>
    </div>
  </div>

  <div class="modal-overlay" id="modal-overlay" onclick="closeModal()"></div>
  <div class="product-modal" id="product-modal">
    <button class="modal-close" onclick="closeModal()">✕</button>
    <div class="modal-img-wrap" id="modal-img-wrap"></div>
    <div class="modal-body">
      <div class="modal-cat" id="modal-cat"></div>
      <h3 class="modal-name" id="modal-name"></h3>
      <p class="modal-desc" id="modal-desc"></p>
      <div class="modal-variants" id="modal-variants"></div>
      <div class="modal-price-row"><span class="modal-price" id="modal-price"></span></div>
      <div class="modal-qty-row">
        <button class="qty-btn" onclick="changeQty(-1)">−</button>
        <span class="qty-display" id="modal-qty">1</span>
        <button class="qty-btn" onclick="changeQty(1)">+</button>
      </div>
      <button class="modal-add-btn" onclick="addFromModal()">
        Agregar al pedido — <span id="modal-subtotal"></span>
      </button>
    </div>
  </div>

<script>
const NOMBRE   = 'La Brasserie';
const WHATSAPP = '5493412000000';
const GOODS = [
  { id:"E01", nombre:"Tabla de quesos premium", descripcion:"Selección de quesos artesanales con mermelada de higos y tostadas", categoria:"Entradas", precio_final:3800 },
  { id:"E02", nombre:"Ceviche de langostinos", descripcion:"Langostinos frescos con leche de tigre, ají amarillo y maíz tostado", categoria:"Entradas", precio_final:4200 },
  { id:"E03", nombre:"Burrata con tomates asados", descripcion:"Burrata fresca, tomates cherry asados, albahaca y reducción de balsámico", categoria:"Entradas", precio_final:3500 },
  { id:"P01", nombre:"Bife de chorizo", descripcion:"400g de bife madurado en seco, papas rústicas y chimichurri de la casa", categoria:"Principales", precio_final:null, variantes:[{id:"v1",label:"300g",precio:7200},{id:"v2",label:"400g",precio:8900},{id:"v3",label:"500g",precio:10500}] },
  { id:"P02", nombre:"Salmón a la plancha", descripcion:"Filet de salmón con manteca de limón y alcaparras, puré de arvejas y vegetales salteados", categoria:"Principales", precio_final:6800 },
  { id:"P03", nombre:"Risotto de hongos", descripcion:"Arroz arbóreo con mix de hongos silvestres, parmesano reggiano y aceite de trufa", categoria:"Principales", precio_final:5200 },
  { id:"P04", nombre:"Pollo al vino blanco", descripcion:"Suprema de pollo braseada en vino blanco con hierbas frescas y papines", categoria:"Principales", precio_final:5600 },
  { id:"D01", nombre:"Fondant de chocolate", descripcion:"Coulant tibio con centro líquido de chocolate belga, helado de vainilla de Madagascar", categoria:"Postres", precio_final:2800 },
  { id:"D02", nombre:"Crème brûlée", descripcion:"Clásica crema quemada con frambuesas frescas y galletita de manteca", categoria:"Postres", precio_final:2400 },
  { id:"D03", nombre:"Tiramisú de la casa", descripcion:"Receta tradicional italiana con mascarpone, café expreso y cacao amargo", categoria:"Postres", precio_final:2600 },
  { id:"B01", nombre:"Vino Malbec Reserva", descripcion:"Copa de Malbec Reserva del Valle de Uco", categoria:"Bebidas", precio_final:null, variantes:[{id:"v1",label:"Copa",precio:1800},{id:"v2",label:"Media botella",precio:4200},{id:"v3",label:"Botella",precio:7800}] },
  { id:"B02", nombre:"Agua mineral", descripcion:"Con o sin gas", categoria:"Bebidas", precio_final:null, variantes:[{id:"v1",label:"500ml",precio:600},{id:"v2",label:"1 litro",precio:900}] },
  { id:"B03", nombre:"Limonada artesanal", descripcion:"Exprimida al momento con jengibre y menta fresca", categoria:"Bebidas", precio_final:1400 }
];

let cart = [], activeCategory = 'all', searchQuery = '';
let modalProduct = null, modalQty = 1, modalVariant = null;

const EMOJI_MAP = { 'entrada':'🥗','principal':'🍽️','postre':'🍮','bebida':'🥤','vino':'🍷' };
function emojiFor(cat) {
  if (!cat) return '🍽️';
  const k = cat.toLowerCase();
  for (const [key, e] of Object.entries(EMOJI_MAP)) { if (k.includes(key)) return e; }
  return '🍽️';
}

document.addEventListener('DOMContentLoaded', () => { buildCategories(); renderProducts(); });

function buildCategories() {
  const cats = ['all', ...new Set(GOODS.map(g=>g.categoria).filter(Boolean))];
  const nav = document.getElementById('category-tabs');
  nav.innerHTML = '';
  cats.forEach(cat => {
    const btn = document.createElement('button');
    btn.className = 'cat-tab' + (cat==='all'?' active':'');
    btn.textContent = cat==='all'?'Todo':cat;
    btn.onclick = () => filterCategory(cat, btn);
    nav.appendChild(btn);
  });
}
function filterCategory(cat, btn) {
  activeCategory = cat; searchQuery = '';
  document.getElementById('search-input').value = '';
  document.querySelectorAll('.cat-tab').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  renderProducts();
}
function filterProducts() {
  searchQuery = document.getElementById('search-input').value.toLowerCase().trim();
  activeCategory = 'all';
  document.querySelectorAll('.cat-tab').forEach((b,i)=>b.classList.toggle('active',i===0));
  renderProducts();
}
function renderProducts() {
  const grid = document.getElementById('products-grid');
  const empty = document.getElementById('empty-state');
  grid.innerHTML = '';
  let items = GOODS;
  if (activeCategory !== 'all') items = items.filter(g=>g.categoria===activeCategory);
  if (searchQuery) items = items.filter(g=>(g.nombre||'').toLowerCase().includes(searchQuery)||(g.descripcion||'').toLowerCase().includes(searchQuery));
  if (!items.length) { empty.classList.remove('hidden'); return; }
  empty.classList.add('hidden');
  if (activeCategory==='all' && !searchQuery) {
    const grouped = {};
    items.forEach(g=>{ const c=g.categoria||'Otros'; if(!grouped[c]) grouped[c]=[]; grouped[c].push(g); });
    Object.entries(grouped).forEach(([cat,prods])=>{
      const t=document.createElement('div'); t.className='category-section-title'; t.textContent=cat; grid.appendChild(t);
      prods.forEach(p=>grid.appendChild(createCard(p)));
    });
  } else { items.forEach(p=>grid.appendChild(createCard(p))); }
}
function getMinPrice(p) {
  if (p.variantes && p.variantes.length) return Math.min(...p.variantes.map(v=>v.precio));
  return p.precio_final || 0;
}
function fmt(n) { return '$'+Number(n).toLocaleString('es-AR'); }
function createCard(p) {
  const price = getMinPrice(p);
  const hasVariants = p.variantes && p.variantes.length > 1;
  const card = document.createElement('div');
  card.className = 'product-card';
  card.onclick = () => openModal(p);
  card.innerHTML = `
    <div class="card-img-wrap"><div class="card-no-img">${emojiFor(p.categoria)}</div></div>
    <div class="card-body">
      ${p.categoria?`<div class="card-cat">${p.categoria}</div>`:''}
      <div class="card-name">${p.nombre}</div>
      ${p.descripcion?`<div class="card-desc">${p.descripcion}</div>`:''}
      <div class="card-footer">
        <span class="card-price">${hasVariants?'Desde ':''} ${fmt(price)}</span>
        <button class="card-add-btn" onclick="event.stopPropagation(); quickAdd(event,'${p.id}')">+</button>
      </div>
    </div>`;
  return card;
}
function quickAdd(e, id) {
  const p = GOODS.find(g=>g.id===id);
  if (!p) return;
  if (p.variantes && p.variantes.length > 1) { openModal(p); return; }
  const v = (p.variantes && p.variantes.length===1) ? p.variantes[0] : null;
  addToCart(p, v, 1, v ? v.precio : p.precio_final);
  bump();
}
function addToCart(p, v, qty, price) {
  const key = p.id + (v?'_'+v.id:'');
  const ex = cart.find(i=>i.key===key);
  if (ex) ex.qty += qty;
  else cart.push({ key, id:p.id, nombre:p.nombre, variantLabel:v?v.label:null, price, qty });
  updateBadge();
}
function changeCartQty(key, d) {
  const item = cart.find(i=>i.key===key);
  if (!item) return;
  item.qty += d;
  if (item.qty <= 0) { cart = cart.filter(i=>i.key!==key); }
  updateBadge(); renderCartItems();
}
function updateBadge() { document.getElementById('cart-count').textContent = cart.reduce((s,i)=>s+i.qty,0); }
function bump() { const b=document.getElementById('cart-count'); b.classList.remove('bump'); void b.offsetWidth; b.classList.add('bump'); setTimeout(()=>b.classList.remove('bump'),300); }
function toggleCart() { document.getElementById('cart-sheet').classList.contains('open') ? closeCart() : openCart(); }
function openCart() { renderCartItems(); document.getElementById('cart-overlay').classList.add('open'); document.getElementById('cart-sheet').classList.add('open'); document.body.style.overflow='hidden'; }
function closeCart() { document.getElementById('cart-overlay').classList.remove('open'); document.getElementById('cart-sheet').classList.remove('open'); document.body.style.overflow=''; }
function renderCartItems() {
  const c=document.getElementById('cart-items'), f=document.getElementById('cart-footer');
  if (!cart.length) { c.innerHTML='<div class="cart-empty-msg">Tu carrito está vacío 🍽️</div>'; f.style.display='none'; return; }
  f.style.display='';
  c.innerHTML='';
  cart.forEach(item=>{
    const r=document.createElement('div'); r.className='cart-item';
    r.innerHTML=`<div class="cart-item-info"><div class="cart-item-name">${item.nombre}</div>${item.variantLabel?`<div class="cart-item-variant">${item.variantLabel}</div>`:''}<div class="cart-item-price">${fmt(item.price*item.qty)}</div></div><div class="cart-item-qty"><button class="qty-sm" onclick="changeCartQty('${item.key}',-1)">−</button><span class="qty-sm-num">${item.qty}</span><button class="qty-sm" onclick="changeCartQty('${item.key}',1)">+</button></div>`;
    c.appendChild(r);
  });
  document.getElementById('cart-total').textContent = fmt(cart.reduce((s,i)=>s+i.price*i.qty,0));
}
function openModal(p) {
  modalProduct=p; modalQty=1;
  modalVariant=(p.variantes&&p.variantes.length)?p.variantes[0]:null;
  document.getElementById('modal-img-wrap').innerHTML=`<div class="modal-no-img">${emojiFor(p.categoria)}</div>`;
  document.getElementById('modal-cat').textContent=p.categoria||'';
  document.getElementById('modal-name').textContent=p.nombre;
  document.getElementById('modal-desc').textContent=p.descripcion||'';
  document.getElementById('modal-qty').textContent='1';
  const vc=document.getElementById('modal-variants');
  if (p.variantes && p.variantes.length>1) {
    vc.innerHTML=`<div class="variants-label">Variante</div><div class="variants-row">${p.variantes.map((v,i)=>`<button class="variant-btn${i===0?' selected':''}" onclick="selVariant('${v.id}')" data-vid="${v.id}">${v.label}</button>`).join('')}</div>`;
  } else vc.innerHTML='';
  updateModalPrice();
  document.getElementById('modal-overlay').classList.add('open');
  document.getElementById('product-modal').classList.add('open');
  document.body.style.overflow='hidden';
}
function closeModal() { document.getElementById('modal-overlay').classList.remove('open'); document.getElementById('product-modal').classList.remove('open'); document.body.style.overflow=''; modalProduct=null; }
function selVariant(id) { if(!modalProduct)return; modalVariant=modalProduct.variantes.find(v=>v.id===id); document.querySelectorAll('.variant-btn').forEach(b=>b.classList.toggle('selected',b.dataset.vid===id)); updateModalPrice(); }
function changeQty(d) { modalQty=Math.max(1,modalQty+d); document.getElementById('modal-qty').textContent=modalQty; updateModalPrice(); }
function updateModalPrice() { if(!modalProduct)return; const u=modalVariant?modalVariant.precio:(modalProduct.precio_final||0); document.getElementById('modal-price').textContent=fmt(u); document.getElementById('modal-subtotal').textContent=fmt(u*modalQty); }
function addFromModal() { if(!modalProduct)return; const u=modalVariant?modalVariant.precio:(modalProduct.precio_final||0); addToCart(modalProduct,modalVariant,modalQty,u); bump(); closeModal(); }
function checkoutWhatsApp() {
  if(!cart.length)return;
  const lines=cart.map(i=>`• ${i.qty}x ${i.nombre}${i.variantLabel?' ('+i.variantLabel+')':''} — ${fmt(i.price*i.qty)}`);
  lines.push(''); lines.push(`*Total: ${fmt(cart.reduce((s,i)=>s+i.price*i.qty,0))}*`);
  window.open(`https://wa.me/${WHATSAPP}?text=${encodeURIComponent('Hola *'+NOMBRE+'*! Quiero hacer el siguiente pedido:\n\n'+lines.join('\n')+'\n\n¡Gracias! 🙏')}`, '_blank');
}
</script>
