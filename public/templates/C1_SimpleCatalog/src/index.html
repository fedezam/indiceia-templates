<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>{{NOMBRE_COMERCIO}}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link rel="preconnect" href="https://oigwwzzmvibflie8.public.blob.vercel-storage.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
</head>
<body>

  <!-- TOAST -->
  <div id="toast" role="status" aria-live="polite"></div>

  <!-- HEADER -->
  <header class="header">
    <div class="header-inner">
      <h1 class="header-title" id="header-title">{{NOMBRE_COMERCIO}}</h1>
      <button class="cart-fab" id="cart-fab" onclick="openCart()" aria-label="Ver carrito">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
        <span class="cart-count" id="cart-count">0</span>
      </button>
    </div>
    <nav class="tabs" id="tabs" aria-label="Categorías"></nav>
  </header>

  <!-- MAIN -->
  <main class="main" id="main"></main>

  <!-- CART OVERLAY -->
  <div class="overlay" id="overlay" onclick="handleOverlayClick(event)" role="dialog" aria-modal="true" aria-label="Carrito de pedido">
    <div class="cart-sheet" id="cart-sheet">
      <div class="cart-drag-handle"></div>
      <div class="cart-header">
        <h2 class="cart-title">Tu pedido</h2>
        <button class="cart-close" onclick="closeCart()" aria-label="Cerrar carrito">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div class="cart-items" id="cart-items">
        <p class="cart-empty">Todavía no agregaste nada 🛒</p>
      </div>
      <div class="cart-footer">

        <div class="delivery-toggle" id="delivery-toggle">
          <button class="delivery-opt active" id="opt-retiro" onclick="setDelivery(false)">
            🏪 Retiro en local
          </button>
          <button class="delivery-opt" id="opt-delivery" onclick="setDelivery(true)">
            🛵 Envío a domicilio
          </button>
        </div>

        <div class="delivery-address" id="delivery-address" style="display:none">
          <input
            type="text"
            id="address-input"
            class="address-input"
            placeholder="Tu dirección de entrega..."
            oninput="updateWaLink()"
          />
        </div>

        <div class="cart-total-row">
          <span class="cart-total-label" id="cart-total-label">Total</span>
          <span class="cart-total-amount" id="cart-total">$0</span>
        </div>

        <a class="wa-btn" id="wa-btn" href="#" target="_blank" rel="noopener">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"/></svg>
          Enviar pedido por WhatsApp
        </a>

      </div>
    </div>
  </div>

  <!-- 🔥 DATA (inyectado por backend) -->
  <script id="__DATA__" type="application/json"></script>
  <script src="https://indiceia-templates.vercel.app/templates/C1_SimpleCatalog/src/script.js"></script>
  
</body>
</html>
