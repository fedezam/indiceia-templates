<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>{{NOMBRE_COMERCIO}}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- compile.js inyecta style.css acá antes de </head> -->
</head>
<body>

  <!-- HERO -->
  <header class="hero">
    <div class="hero-inner">
      <div class="hero-badge" id="hero-badge">Prestador de servicios</div>
      <h1>{{NOMBRE_COMERCIO}}</h1>
      <p class="hero-sub" id="hero-sub"></p>
      <div class="hero-meta" id="hero-meta"></div>
    </div>
  </header>

  <!-- WAVE -->
  <svg class="wave" viewBox="0 0 1440 40" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M0,40 L0,20 Q360,0 720,20 Q1080,40 1440,20 L1440,40 Z" fill="#1b4332"/>
    <path d="M0,40 L0,28 Q360,8 720,28 Q1080,48 1440,28 L1440,40 Z" fill="#f7f4ef"/>
  </svg>

  <!-- SERVICIOS -->
  <section class="section">
    <h2 class="section-title">Servicios</h2>
    <div class="services-list" id="services-list"></div>
  </section>

  <!-- GALERÍA -->
  <section class="section" id="gallery-section">
    <h2 class="section-title">Trabajos realizados</h2>
    <div class="gallery-grid" id="gallery-grid"></div>
  </section>

  <!-- HORARIOS -->
  <section class="section">
    <h2 class="section-title">Horarios</h2>
    <div class="horarios-grid" id="horarios-grid"></div>
  </section>

  <!-- CONTACTO -->
  <section class="section">
    <h2 class="section-title">Contacto</h2>
    <div class="contact-card">
      <div id="contact-rows"></div>
    </div>
  </section>

  <!-- FOOTER -->
  <footer class="footer">
    <p>Powered by <a href="https://indiceia.app" target="_blank">ÍndiceIA</a></p>
  </footer>

  <!-- LIGHTBOX -->
  <div class="lightbox" id="lightbox" onclick="if(event.target===this)closeLightbox()">
    <button class="lightbox-close" onclick="closeLightbox()">✕</button>
    <img id="lightbox-img" src="" alt="Foto trabajo">
  </div>

  <!-- CTA FLOTANTE -->
  <div class="cta-float">
    <div class="selected-label" id="selected-label"></div>
    <a class="cta-btn" id="cta-btn" href="#" target="_blank">
