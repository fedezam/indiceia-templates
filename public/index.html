<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Menú - IndiceIA</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body {
      margin: 0;
      font-family: system-ui, sans-serif;
    }
  </style>
</head>

<body>
  <div id="root">
    <div class="flex items-center justify-center h-screen bg-gray-100">
      <div class="text-center">
        <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-amber-600 mx-auto"></div>
        <p class="mt-4 text-slate-600">Cargando menú...</p>
      </div>
    </div>
  </div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const MenuSimple = () => {
      const [data, setData] = useState(null);
      const [cart, setCart] = useState([]);
      const [showCart, setShowCart] = useState(false);
      const [toast, setToast] = useState(null);
      const [cartBounce, setCartBounce] = useState(false);

      /* =====================================================
         🔑 RECEPCIÓN DE BLOQUE B (CORREGIDO)
         ===================================================== */
      useEffect(() => {
        const handler = (event) => {
          // Compatibilidad: backend nuevo + legacy
          const payload = event.data?.bloque_B_contexto_comercial || event.data;

          // Validación mínima del contrato Bloque B
          if (payload?.identity && payload?.catalogo?.secciones) {
            setData(payload);
          }
        };

        window.addEventListener('message', handler);

        // Handshake con el padre (Entity Factory / Claude)
        window.parent.postMessage({ type: 'TEMPLATE_READY' }, '*');

        return () => window.removeEventListener('message', handler);
      }, []);

      if (!data) return null;

      /* =====================================================
         📦 EXTRACCIÓN DIRECTA (TEMPLATE-FRIENDLY)
         ===================================================== */
      const { identity = {}, contacto = {}, catalogo = {} } = data;

      const nombreComercio = identity.nombre_comercio || 'Comercio';
      const whatsappNumber = contacto.whatsapp_number || '';
      const seccionesRaw = catalogo.secciones || [];

      const secciones = seccionesRaw
        .filter(s => s.items && s.items.length > 0)
        .sort((a, b) => (a.prioridad || 99) - (b.prioridad || 99));

      if (secciones.length === 0) {
        return (
          <div className="flex items-center justify-center h-screen bg-gray-50">
            <p className="text-slate-600 text-lg">
              No hay productos disponibles en este momento.
            </p>
          </div>
        );
      }

      const addToCart = (item, size = null) => {
        const precio = size
          ? (size === 'mediana'
              ? item.precio_mediana
              : item.precio_grande)
          : item.precio_final || item.precio || 0;

        const newItem = {
          ...item,
          size,
          precio,
          cartId: Date.now() + Math.random()
        };

        setCart([...cart, newItem]);

        const sizeText = size
          ? ` (${size.charAt(0).toUpperCase() + size.slice(1)})`
          : '';

        setToast(`✓ ${item.nombre}${sizeText} agregado`);
        setTimeout(() => setToast(null), 2000);

        setCartBounce(true);
        setTimeout(() => setCartBounce(false), 500);
      };

      const removeFromCart = (cartId) =>
        setCart(cart.filter(i => i.cartId !== cartId));

      const getTotal = () =>
        cart.reduce((sum, i) => sum + i.precio, 0);

      const generateWhatsAppMessage = () => {
        let mensaje = `Hola! Vengo de INDICEIA - ${nombreComercio}\n\nMI PEDIDO:\n\n`;
        cart.forEach(item => {
          const sizeText = item.size ? ` (${item.size})` : '';
          mensaje += `• ${item.nombre}${sizeText} [${item.id}] - $${item.precio.toLocaleString()}\n`;
        });
        mensaje += `\nTOTAL: $${getTotal().toLocaleString()}\n\nGracias!`;
        return `https://wa.me/${whatsappNumber}?text=${encodeURIComponent(mensaje)}`;
      };

      const totalItems = cart.length;

      return (
        <div className="min-h-screen bg-gradient-to-br from-slate-50 via-gray-50 to-slate-100">

          {toast && (
            <div className="fixed top-24 left-1/2 -translate-x-1/2 bg-slate-700 text-white px-4 py-2 rounded-lg shadow-xl z-50 text-sm font-semibold">
              {toast}
            </div>
          )}

          <div className="sticky top-0 z-40 bg-slate-800 text-white shadow-lg">
            <div className="px-4 py-3 flex justify-between items-center">
              <h1 className="text-lg font-bold">{nombreComercio}</h1>
              <button
                onClick={() => setShowCart(true)}
                className={`relative bg-amber-600 px-4 py-2 rounded-full font-bold flex items-center gap-2 transition-transform ${
                  cartBounce ? 'scale-110' : ''
                }`}
              >
                <lucide.icons.shoppingCart size={18} />
                <span>{totalItems}</span>
              </button>
            </div>
          </div>

          <div className="p-4 pb-32 space-y-12">
            {secciones.map(seccion => (
              <section key={seccion.id}>
                <h2 className="text-2xl font-bold text-slate-800 mb-6 text-center">
                  {seccion.titulo}
                </h2>

                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                  {seccion.items.map(item => (
                    <div key={item.id} className="bg-white rounded-xl shadow-lg overflow-hidden flex flex-col">
                      <div className="relative h-48 bg-gray-200">
                        <img
                          src={item.imagen || 'https://via.placeholder.com/600x400?text=Sin+Imagen'}
                          alt={item.nombre}
                          className="w-full h-full object-cover"
                        />
                        <div className="absolute top-2 right-2 bg-slate-800 text-white px-2 py-1 rounded text-xs font-bold">
                          {item.id}
                        </div>
                      </div>

                      <div className="p-4 flex flex-col flex-grow">
                        <h3 className="font-bold text-lg mb-2">{item.nombre}</h3>
                        {item.descripcion && (
                          <p className="text-sm text-slate-600 mb-4 flex-grow">
                            {item.descripcion}
                          </p>
                        )}

                        <div className="mt-auto space-y-2">
                          {(item.precio_mediana || item.precio_grande) ? (
                            <>
                              {item.precio_mediana && (
                                <div className="flex justify-between items-center bg-amber-50 p-3 rounded-lg">
                                  <div>
                                    <p className="text-sm font-semibold">Mediana</p>
                                    <p className="text-amber-600 font-bold">
                                      ${item.precio_mediana.toLocaleString()}
                                    </p>
                                  </div>
                                  <button
                                    onClick={() => addToCart(item, 'mediana')}
                                    className="bg-amber-600 text-white p-2 rounded-full"
                                  >
                                    <lucide.icons.plus size={20} />
                                  </button>
                                </div>
                              )}

                              {item.precio_grande && (
                                <div className="flex justify-between items-center bg-amber-50 p-3 rounded-lg">
                                  <div>
                                    <p className="text-sm font-semibold">Grande</p>
                                    <p className="text-amber-600 font-bold">
                                      ${item.precio_grande.toLocaleString()}
                                    </p>
                                  </div>
                                  <button
                                    onClick={() => addToCart(item, 'grande')}
                                    className="bg-amber-600 text-white p-2 rounded-full"
                                  >
                                    <lucide.icons.plus size={20} />
                                  </button>
                                </div>
                              )}
                            </>
                          ) : (
                            <div className="flex justify-between items-center bg-amber-50 p-3 rounded-lg">
                              <p className="text-amber-600 font-bold text-xl">
                                ${item.precio_final.toLocaleString()}
                              </p>
                              <button
                                onClick={() => addToCart(item)}
                                className="bg-amber-600 text-white px-6 py-3 rounded-lg font-bold flex items-center gap-2"
                              >
                                <lucide.icons.plus size={20} />
                                Agregar
                              </button>
                            </div>
                          )}
                        </div>
                      </div>
                    </div>
                  ))}
                </div>
              </section>
            ))}
          </div>

          {showCart && totalItems > 0 && (
            <div className="fixed inset-0 bg-black bg-opacity-60 z-50 flex items-end" onClick={() => setShowCart(false)}>
              <div className="bg-white w-full rounded-t-3xl shadow-2xl max-h-96 overflow-y-auto" onClick={e => e.stopPropagation()}>
                <div className="sticky top-0 bg-slate-800 text-white p-4 flex justify-between items-center">
                  <h2 className="font-bold text-lg flex items-center gap-2">
                    <lucide.icons.shoppingCart size={20} />
                    Tu Pedido ({totalItems})
                  </h2>
                  <button onClick={() => setShowCart(false)} className="text-white text-2xl">×</button>
                </div>

                <div className="p-4 space-y-3">
                  {cart.map(item => (
                    <div key={item.cartId} className="flex justify-between items-center bg-slate-50 p-3 rounded-lg">
                      <div className="flex-1">
                        <p className="font-bold">{item.nombre}</p>
                        {item.size && <p className="text-sm text-slate-600">({item.size})</p>}
                        <p className="text-xs text-slate-500">[{item.id}]</p>
                      </div>
                      <div className="flex items-center gap-3">
                        <span className="font-bold text-amber-600">
                          ${item.precio.toLocaleString()}
                        </span>
                        <button onClick={() => removeFromCart(item.cartId)} className="text-red-600">
                          <lucide.icons.trash2 size={18} />
                        </button>
                      </div>
                    </div>
                  ))}

                  <div className="border-t-2 pt-4">
                    <div className="flex justify-between mb-4">
                      <span className="font-bold text-xl">TOTAL</span>
                      <span className="font-bold text-2xl text-amber-600">
                        ${getTotal().toLocaleString()}
                      </span>
                    </div>

                    <a
                      href={generateWhatsAppMessage()}
                      target="_blank"
                      className="w-full bg-green-600 text-white py-4 rounded-lg font-bold text-lg flex items-center justify-center gap-3"
                    >
                      <lucide.icons.send size={24} />
                      Enviar pedido por WhatsApp
                    </a>
                  </div>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<MenuSimple />);
  </script>

  <script>
    lucide.createIcons();
  </script>
</body>
</html>
